# Simulated velocity controller. cmd_vel_timeout matches our robot
# (platform_velocity_controller, read 2026-11-06). The velocity and
# acceleration limits are Clearpath's defaults for the A200, not measured.
/**:
  ros__parameters:
    cmd_vel_timeout: 0.5
    max_linear_velocity: 1.0
    max_angular_velocity: 2.0
    max_linear_acceleration: 3.0
    max_angular_acceleration: 6.0
    rate: 50.0
    stop_mark_x: 3.0
