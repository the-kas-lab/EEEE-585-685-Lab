# Same inputs, priorities and timeouts as twist_mux on our Husky
# (read from the robot with `ros2 param dump` on 2026-11-06).
/**:
  ros__parameters:
    topics:
      rc_teleop:
        topic: rc_teleop/cmd_vel
        timeout: 0.5
        priority: 12
      joy_teleop:
        topic: joy_teleop/cmd_vel
        timeout: 0.5
        priority: 10
      interactive_marker:
        topic: twist_marker_server/cmd_vel
        timeout: 0.5
        priority: 8
      external:
        topic: cmd_vel
        timeout: 0.5
        priority: 1
    locks:
      e_stop:
        topic: platform/emergency_stop
        timeout: 0.0
        priority: 255
